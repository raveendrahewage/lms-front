<div class="w-full mt-5">
  <div class="p-4 bg-white rounded-lg">
    <button
      class="ml-3 p-2 bg-slate-200 text-white rounded float-right border border-gray-300"
      (click)="toggleMode(!isEdit)"
    >
      <mat-icon style="color: black">{{ isEdit ? "close" : "edit" }}</mat-icon>
    </button>
    <div class="flex flex-wrap">
      <div class="w-full md:w-1/3">
        <div class="profile-img mb-4 md:mb-0">
          <img
            src="../../../../../favicon.ico"
            class="employee-profile-img w-full h-auto rounded-full"
            alt="profile image"
          />
        </div>
      </div>
      <div class="w-full md:w-2/3">
        <div class="profile-head">
          <form [formGroup]="leaveTypeUpdateForm" (ngSubmit)="onSubmit()">
            <div class="form-group flex flex-wrap mb-4">
              <div class="w-full md:w-1/2 pr-2 mb-2 md:mb-0">
                <mat-form-field appearance="outline" class="w-full">
                  <mat-label class="text-black">First Name</mat-label>
                  <input
                    matInput
                    name="firstName"
                    placeholder="Enter first name"
                    formControlName="firstName"
                    type="text"
                    class="text-black"
                  />
                </mat-form-field>
              </div>
              <div class="w-full md:w-1/2">
                <app-option-toggle
                  [control]="leaveTypeUpdateForm.controls.status"
                  [options]="statuses"
                ></app-option-toggle>
              </div>
            </div>
            <button
              mat-raised-button
              color="primary"
              class="mt-3 w-full bg-blue-500 text-white py-2 rounded"
              type="submit"
              [disabled]="!isEdit"
            >
              Update
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
