<div class="flex justify-between w-1/2 mx-auto p-6 bg-white rounded-lg">
  <form
    [formGroup]="leaveTypeUpdateForm"
    (ngSubmit)="onSubmit()"
    class="flex-1 pr-6"
  >
    <div class="form-group flex flex-wrap mb-4">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label class="text-black">Name</mat-label>
        <input
          matInput
          name="name"
          placeholder="Enter name"
          formControlName="name"
          type="text"
          class="text-black"
        />
      </mat-form-field>
    </div>
    <div class="w-full form-group flex flex-wrap mb-4">
      <div class="w-full md:w-1/2 pr-2 mb-2 md:mb-0">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label class="text-black">Default No. Of Leaves</mat-label>
          <input
            matInput
            name="name"
            placeholder="Enter name"
            formControlName="defaultLeaveCount"
            type="number"
            min="0"
            class="text-black"
          />
        </mat-form-field>
      </div>
      <div class="w-full md:w-1/2">
        <app-option-toggle
          [control]="leaveTypeUpdateForm.controls.status"
          [options]="statuses"
        ></app-option-toggle>
      </div>
    </div>
    <button
      mat-raised-button
      color="primary"
      class="mt-3 w-full bg-blue-500 text-white py-2 rounded"
      type="submit"
      [disabled]="!isEditable"
    >
      Save
    </button>
  </form>
  <button
    type="button"
    class="p-2 bg-slate-200 text-white rounded border border-gray-300 self-start"
    (click)="toggleMode(!isEditable)"
  >
    <mat-icon style="color: black">{{
      isEditable ? "close" : "edit"
    }}</mat-icon>
  </button>
</div>
