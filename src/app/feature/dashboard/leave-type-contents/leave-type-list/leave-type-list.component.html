<div class="content-box p-4 bg-white rounded-lg">
  @if(loading){
  <div class="mb-4">
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  </div>
  }
  <form [formGroup]="searchForm" (ngSubmit)="getAllLeaveTypes()">
    <div class="form-group flex flex-wrap">
      <div class="w-full md:w-1/2 pr-2">
        <mat-form-field appearance="outline" class="w-full">
          <input
            matInput
            name="searchTerm"
            placeholder="Search.."
            formControlName="searchTerm"
            type="text"
            class="text-black"
            (input)="onSearchTermChange()"
          />
        </mat-form-field>
      </div>
      <div class="w-full md:w-1/2">
        <button
          mat-raised-button
          type="submit"
          class="bg-blue-500 text-white rounded p-3"
        >
          <mat-icon>search</mat-icon>
        </button>
      </div>
    </div>
  </form>
  <table
    mat-table
    class="w-full"
    [dataSource]="leaveTypes"
    matSort
    (matSortChange)="onSortChange($event)"
  >
    <ng-container matColumnDef="index">
      <th mat-header-cell *matHeaderCellDef class="px-4 py-2">No.</th>
      <td mat-cell *matCellDef="let leaveType; let i = index" class="px-4 py-2">
        {{ getRecordIndex(i) }}
      </td>
    </ng-container>
    <ng-container matColumnDef="name">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
        class="cursor-pointer px-4 py-2"
      >
        Name
      </th>
      <td mat-cell *matCellDef="let leaveType" class="px-4 py-2">
        {{ leaveType.name }}
      </td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
        class="cursor-pointer px-4 py-2"
      >
        Status
      </th>
      <td mat-cell *matCellDef="let leaveType" class="px-4 py-2">
        <app-data-record-status-chip [status]="leaveType.status">
        </app-data-record-status-chip>
      </td>
    </ng-container>
    <ng-container matColumnDef="options">
      <th mat-header-cell *matHeaderCellDef class="px-4 py-2">Options</th>
      <td mat-cell *matCellDef="let leaveType" class="px-4 py-2">
        <a
          [routerLink]="'/dashboard/leave-types/details/' + leaveType.id"
          class="text-blue-500 hover:underline"
        >
          View
        </a>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <div class="flex justify-end items-center mt-4">
    <mat-paginator
      [pageSizeOptions]="[5, 10, 20]"
      [length]="totalRecords"
      [pageSize]="pageSize"
      (page)="onPageChange($event)"
      showFirstLastButtons
    ></mat-paginator>
  </div>
</div>
