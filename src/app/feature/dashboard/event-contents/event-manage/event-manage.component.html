<form
  [formGroup]="eventForm"
  (ngSubmit)="onSubmit()"
  class="w-1/2 mx-auto mt-5"
>
  <div class="mb-4">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label class="text-black">Title</mat-label>
      <input
        matInput
        name="lastName"
        placeholder="Enter title"
        formControlName="title"
        type="text"
        class="text-black"
      />
    </mat-form-field>
  </div>
  <div class="mb-4">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label class="text-black">Description</mat-label>
      <textarea
        matInput
        type="text"
        id="reason"
        formControlName="description"
        placeholder="Enter description"
        class="text-black"
      ></textarea>
    </mat-form-field>
  </div>
  <div class="form-group flex flex-wrap mb-4">
    <div class="w-full md:w-1/2 pr-2 mb-2 md:mb-0">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label class="text-black">Start Date</mat-label>
        <input
          matInput
          [matDatepicker]="pickerFrom"
          id="startDate"
          formControlName="startDate"
          placeholder="Start date"
          class="text-black"
        />
        <mat-datepicker-toggle
          matSuffix
          [for]="pickerFrom"
        ></mat-datepicker-toggle>
        <mat-datepicker #pickerFrom></mat-datepicker>
      </mat-form-field>
    </div>
    <div class="w-full md:w-1/2 mb-2 md:mb-0">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label class="text-black">End Date</mat-label>
        <input
          matInput
          [min]="this.eventForm.controls.startDate.value"
          [matDatepicker]="pickerTo"
          id="endDate"
          formControlName="endDate"
          placeholder="End date"
          class="text-black"
        />
        <mat-datepicker-toggle
          matSuffix
          [for]="pickerTo"
        ></mat-datepicker-toggle>
        <mat-datepicker #pickerTo></mat-datepicker>
      </mat-form-field>
    </div>
  </div>
  <div class="w-full flex first-line: justify-end">
    <app-option-toggle
      [control]="eventForm.controls.eventStatus"
      [options]="statuses"
    ></app-option-toggle>
  </div>
  <button
    mat-raised-button
    color="primary"
    class="mt-3 w-full bg-blue-500 text-white py-2 rounded"
    type="submit"
  >
    Save
  </button>
</form>
