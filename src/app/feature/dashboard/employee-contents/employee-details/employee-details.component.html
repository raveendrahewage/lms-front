<div class="w-full mt-5">
  <div class="p-4 bg-white rounded-lg">
    <button
      class="ml-3 p-2 bg-slate-200 text-white rounded float-right border border-gray-300"
      (click)="toggleMode(!isEditable)"
      [disabled]="
        !authService.isAdmin() &&
        authService.getCurrentSystemUserId() !== systemUser.id
      "
    >
      <mat-icon style="color: black">{{
        isEditable ? "close" : "edit"
      }}</mat-icon>
    </button>
    <div class="flex flex-wrap">
      <div class="w-full md:w-1/3">
        <div class="profile-img mb-4 md:mb-0">
          <img
            src="../../../../../favicon.ico"
            class="employee-profile-img w-full h-auto rounded-full"
            alt="profile image"
          />
        </div>
      </div>
      <div class="w-full md:w-2/3">
        <div class="profile-head">
          <form [formGroup]="profileUpdateForm" (ngSubmit)="onSubmit()">
            <div class="form-group flex flex-wrap mb-4">
              <div class="w-full md:w-1/2 pr-2 mb-2 md:mb-0">
                <mat-form-field appearance="outline" class="w-full">
                  <mat-label class="text-black">First Name</mat-label>
                  <input
                    matInput
                    name="firstName"
                    placeholder="Enter first name"
                    formControlName="firstName"
                    type="text"
                    class="text-black"
                  />
                </mat-form-field>
              </div>
              <div class="w-full md:w-1/2">
                <mat-form-field appearance="outline" class="w-full">
                  <mat-label class="text-black">Last Name</mat-label>
                  <input
                    matInput
                    name="lastName"
                    placeholder="Enter last name"
                    formControlName="lastName"
                    type="text"
                    class="text-black"
                  />
                </mat-form-field>
              </div>
            </div>
            <div class="form-group flex flex-wrap mb-4">
              <div class="w-full md:w-1/2 pr-2 mb-2 md:mb-0">
                <mat-form-field appearance="outline" class="w-full">
                  <mat-label class="text-black">Email</mat-label>
                  <input
                    matInput
                    name="email"
                    placeholder="Enter email"
                    formControlName="email"
                    type="text"
                    class="text-black"
                  />
                </mat-form-field>
              </div>
              <div class="w-full md:w-1/2">
                <mat-form-field appearance="outline" class="w-full">
                  <mat-label class="text-black">Phone Number</mat-label>
                  <input
                    matInput
                    name="phoneNumber"
                    placeholder="Enter phone number"
                    formControlName="phoneNumber"
                    type="number"
                    class="text-black"
                  />
                </mat-form-field>
              </div>
            </div>
            <div class="form-group flex flex-wrap mb-4">
              <div class="w-full md:w-1/2 pr-2 mb-2 md:mb-0">
                <mat-form-field appearance="outline" class="w-full">
                  <mat-label class="text-black">Supervisor</mat-label>
                  <mat-select
                    formControlName="supervisorId"
                    placeholder="Select a supervisor"
                    class="text-black"
                  >
                    @for (item of allEmployees; track $index) {
                    <mat-option [value]="item.id">
                      {{ item.fullName }}
                    </mat-option>
                    }
                  </mat-select>
                </mat-form-field>
              </div>
              <div class="w-full md:w-1/2">
                <app-option-toggle
                  [control]="profileUpdateForm.controls.status"
                  [options]="statuses"
                ></app-option-toggle>
              </div>
            </div>
            <button
              mat-raised-button
              color="primary"
              class="mt-3 w-full bg-blue-500 text-white py-2 rounded"
              type="submit"
              [disabled]="!isEditable"
            >
              Save
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
