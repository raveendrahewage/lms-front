<nav id="sidebar" [class]="isOpen ? 'active' : ''">
  <ul class="list-unstyled sidebar-items">
    <p class="sidebar-header">Company Name</p>
    @for (item of routes; track $index) {
    <li>
      <a [routerLink]="item.path" routerLinkActive="active">{{ item.text }}</a>
    </li>
    }
  </ul>
</nav>
