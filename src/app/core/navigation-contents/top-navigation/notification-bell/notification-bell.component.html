<div class="notification-wrapper">
    <!-- Bell Button -->
    <button class="bell-btn mr-2" (click)="toggleDropdown()">
        <mat-icon class="bell-icon">notifications</mat-icon>
        @if(unreadCount > 0){
        <span class="badge">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
        }
    </button>

    <!-- Dropdown Menu -->
    <div class="dropdown-panel" *ngIf="isOpen">
        <div class="dropdown-header">
            <h4>Notifications</h4>
            @if(unreadCount > 0){
            <button class="btn-link" (click)="markAllAsRead()">Mark all read</button>
            }
        </div>

        <div class="dropdown-body">
            @if(notifications.length === 0){
            <div class="empty-state">
                No notifications yet.
            </div>
            } @else {
            @for (item of notifications; track item.id) {
            <div class="notification-item" [class.unread]="!item.isRead" (click)="onNotificationClick(item)">
                <div class="item-title">{{ item.title }}</div>
                <div class="item-message">{{ item.message }}</div>
                <div class="item-time">{{ item.createdDate | date:'shortTime' }}</div>
            </div>
            }}
        </div>
    </div>
</div>
